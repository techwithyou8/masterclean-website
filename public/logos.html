<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MasterClean Logo Gallery</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b1220; color: #e5e7eb; }
      header { position: sticky; top: 0; background: #0f172a; padding: 16px 24px; border-bottom: 1px solid #1f2937; }
      h1 { margin: 0; font-size: 18px; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .card { background: #0f172a; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
      .img-wrap { background: #ffffff; border-radius: 8px; width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 140px; }
      img { max-width: 100%; max-height: 120px; object-fit: contain; }
      .caption { margin-top: 10px; font-size: 12px; color: #9ca3af; word-break: break-all; text-align: center; }
      .hint { margin-top: 8px; font-size: 12px; color: #9ca3af; }
      a { color: #93c5fd; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <h1>MasterClean Logos Preview</h1>
      <div class="hint">Click any image to open it directly.</div>
    </header>
    <div class="wrap">
      <div class="grid">
        <div class="card">
          <a href="/masterclean-logo.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/masterclean-logo.png" alt="masterclean-logo.png" />
            </div>
          </a>
          <div class="caption">masterclean-logo.png</div>
        </div>
        <div class="card">
          <a href="/masterclean-logo-final.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/masterclean-logo-final.png" alt="masterclean-logo-final.png" />
            </div>
          </a>
          <div class="caption">masterclean-logo-final.png</div>
        </div>
        <div class="card">
          <a href="/masterclean-logo-new.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/masterclean-logo-new.png" alt="masterclean-logo-new.png" />
            </div>
          </a>
          <div class="caption">masterclean-logo-new.png</div>
        </div>
        <div class="card">
          <a href="/masterclean-logo-updated.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/masterclean-logo-updated.png" alt="masterclean-logo-updated.png" />
            </div>
          </a>
          <div class="caption">masterclean-logo-updated.png</div>
        </div>
        <div class="card">
          <a href="/masterclean-logo-transparent.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/masterclean-logo-transparent.png" alt="masterclean-logo-transparent.png" />
            </div>
          </a>
          <div class="caption">masterclean-logo-transparent.png</div>
        </div>
        <div class="card">
          <a href="/mastercerclean-logo.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/mastercerclean-logo.png" alt="mastercerclean-logo.png" />
            </div>
          </a>
          <div class="caption">mastercerclean-logo.png (old typo)</div>
        </div>
        <div class="card">
          <a href="/mastercerclean-footer-logo.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/mastercerclean-footer-logo.png" alt="mastercerclean-footer-logo.png" />
            </div>
          </a>
          <div class="caption">mastercerclean-footer-logo.png (old typo)</div>
        </div>
        <div class="card">
          <a href="/placeholder-logo.png" target="_blank" rel="noreferrer">
            <div class="img-wrap">
              <img src="/placeholder-logo.png" alt="placeholder-logo.png" />
            </div>
          </a>
          <div class="caption">placeholder-logo.png</div>
        </div>
      </div>
    </div>
  </body>
</html>
